# Marketplace publication is deliberately separate from GitHub releases.
# Requires the existing PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, and
# CERTIFICATE_CHAIN secrets. No GitHub release event starts this workflow.

name: Publish to JetBrains Marketplace
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release tag to publish (for example, v1.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Plugin
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Stable Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Choose a stable vMAJOR.MINOR.PATCH release tag." >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("A published stable release is required") else . end' > /dev/null
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Release Sources
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Check Plugin Version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^pluginVersion[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' gradle.properties)
          if [[ "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo "The release tag and gradle.properties pluginVersion must match." >&2
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Test and Verify Plugin
        run: ./gradlew check verifyPlugin

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
