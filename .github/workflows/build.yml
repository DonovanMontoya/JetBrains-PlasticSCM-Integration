# GitHub Actions Workflow is created for testing and preparing the plugin release in the following steps:
# - Validate Gradle Wrapper.
# - Run 'test' and 'verifyPlugin' tasks.
# - Run Qodana inspections.
# - Run the 'buildPlugin' task and prepare artifact for further tests.
# - Run the 'runPluginVerifier' task.
# - Publish a development GitHub release after all checks pass on main.
#
# The workflow is triggered on push and pull_request events.
#
# GitHub Actions reference: https://help.github.com/en/actions
#
## JBIJPPTPL

name: Build
on:
  # Trigger the workflow on pushes to only the 'main' branch (this avoids duplicate checks being run e.g., for dependabot pull requests)
  push:
    branches: [ main ]
  # Trigger the workflow on any pull request
  pull_request:
  # Allow running the workflow manually on any branch
  workflow_dispatch:
    inputs:
      publish_stable_release:
        description: Publish the version in gradle.properties as a stable GitHub release (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Stable builds retain pluginVersion. Main pushes use the next patch's
      # development version so every archive has a distinct plugin version.
      - name: Select Plugin Version
        id: version
        shell: bash
        env:
          PUBLISH_STABLE_RELEASE: ${{ inputs.publish_stable_release }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(sed -nE 's/^pluginVersion[[:space:]]*=[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' gradle.properties)
          if [[ ! "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "pluginVersion must be a stable SemVer version (for example, 1.0.0)." >&2
            exit 1
          fi
          VERSION="$BASE_VERSION"
          PRERELEASE=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            PRERELEASE=true
          fi
          if [[ "$PUBLISH_STABLE_RELEASE" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Stable releases must be built from main." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # Build plugin
      - name: Build plugin
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew buildPlugin -PpluginVersion="$PLUGIN_VERSION"

      # Store an already-built plugin as an artifact for downloading
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          # Preserve the installable ZIP and its top-level plugin directory.
          path: ./build/distributions/*.zip
          if-no-files-found: error

  # Run tests and upload a code coverage report
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Run tests
      - name: Run Tests
        env:
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: ./gradlew check -PpluginVersion="$PLUGIN_VERSION"

      # Collect Tests Result of failed tests
      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      # Upload the Kover report to CodeCov
      - name: Upload Code Coverage Report
        uses: codecov/codecov-action@v5
        with:
          files: ${{ github.workspace }}/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Run Qodana inspections and provide a report
  inspectCode:
    name: Inspect code
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }} # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0 # a full history is required for pull request analysis

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Run Qodana inspections
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2025.3.1
        with:
          cache-default-branch-only: true

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        env:
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: ./gradlew verifyPlugin -PpluginVersion="$PLUGIN_VERSION"

      # Collect Plugin Verifier Result
      - name: Collect Plugin Verifier Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  # GitHub releases are independent of the manual Marketplace workflow.
  # Pull requests and ordinary manual builds never publish a release.
  release:
    name: Publish GitHub Release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_stable_release))
    needs: [ build, test, inspectCode, verify ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - name: Download Installable Plugin
        uses: actions/download-artifact@v8
        with:
          name: plugin-distribution
          path: release-assets

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(release-assets/*.zip)
          if [[ ${#ASSETS[@]} -ne 1 ]]; then
            echo "Expected exactly one installable plugin ZIP." >&2
            exit 1
          fi
          unzip -t "${ASSETS[0]}"
          FLAGS=()
          if [[ "$PRERELEASE" == true ]]; then
            FLAGS+=(--prerelease --latest=false)
            NOTES="Development build from main at $GITHUB_SHA. Install the attached ZIP from disk. This build is not published to JetBrains Marketplace."
          else
            FLAGS+=(--latest)
            NOTES="Stable GitHub build from $GITHUB_SHA. Install the attached ZIP from disk. Marketplace publishing is a separate manual action."
          fi
          # Create the tag atomically at the tested commit. A pre-existing tag
          # (even without a release) must fail instead of silently using other sources.
          # Never move tags, replace release assets, or delete drafts.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/v$PLUGIN_VERSION" \
            -f "sha=$GITHUB_SHA" > /dev/null
          gh release create "v$PLUGIN_VERSION" "${ASSETS[@]}" \
            --verify-tag \
            --title "$PLUGIN_VERSION" \
            --notes "$NOTES" \
            --generate-notes \
            "${FLAGS[@]}"
